<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Image Crop & Resize Tool</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; max-width: 900px; }
    h2 { margin-bottom: 4px; }
    h3 { margin: 22px 0 8px; }
    #canvas { border: 1px solid #ccc; cursor: crosshair; max-width: 100%; height: auto; touch-action: none; background: #fafafa; }
    .row { margin: 8px 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    button, .btn { padding: 7px 12px; border: 1px solid #999; background: #f2f2f2; border-radius: 5px; cursor: pointer; font-size: 14px; color: #000; text-decoration: none; }
    button:hover, .btn:hover { background: #e4e4e4; }
    button.active { background: #333; color: #fff; border-color: #333; }
    button:disabled { opacity: .5; cursor: default; }
    input[type=number] { width: 80px; padding: 6px; }
    #info { color: #555; font-size: 14px; margin: 6px 0; }
    #downloadLink.disabled { opacity: .5; pointer-events: none; }
  </style>
</head>
<body>
  <h2>Image Crop &amp; Resize Tool</h2>
  <input type="file" id="upload" accept="image/png,image/jpeg,image/webp">

  <h3>1. Crop</h3>
  <div class="row" id="cropTemplates"></div>
  <div class="row">
    Crop size (px) <input type="number" id="cw" min="1" max="8000" value="1700"> ×
    <input type="number" id="ch" min="1" max="8000" value="900">
    <button id="cropSizeBtn">Use this size</button>
  </div>
  <div id="info">No image loaded</div>
  <canvas id="canvas" width="600" height="300"></canvas>
  <div class="row">
    <button id="cropBtn" disabled>Crop</button>
    <button id="resetBtn" disabled>Reset to original</button>
  </div>

  <h3>2. Resize</h3>
  <div class="row" id="resizeTemplates"></div>
  <div class="row">
    Width <input type="number" id="w" min="1" max="8000">
    Height <input type="number" id="h" min="1" max="8000">
    <label><input type="checkbox" id="lock" checked> Keep aspect ratio</label>
    <button id="resizeBtn" disabled>Resize</button>
  </div>

  <h3>3. Download</h3>
  <div class="row">
    <a id="downloadLink" class="btn disabled" href="#">Download</a>
    <span id="dlInfo" style="color:#555;font-size:14px"></span>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const canvas = $('canvas'), ctx = canvas.getContext('2d');
    const work = document.createElement('canvas');   // current image (after crops/resizes)
    const wctx = work.getContext('2d');

    // ---- Simple templates ----
    const CROP_TEMPLATES = [
      { name: '1700×900 px', px: { w: 1700, h: 900 } }
    ];
    const RESIZE_TEMPLATES = [
      { name: '506×306 px', w: 506, h: 306 }
    ];

    let original = null;       // original loaded image
    let meta = null;           // { name, mime }
    let ratio = null;          // active crop ratio (null = free)
    let fixed = null;          // fixed crop size in pixels {w, h}
    let warn = '';
    let sel = null;            // {x, y, w, h} in image pixels
    let drag = null;           // {sx, sy}
    let blobUrl = null;

    // ---- Build template buttons ----
    CROP_TEMPLATES.forEach((t, i) => {
      const b = document.createElement('button');
      b.textContent = t.name;
      b.onclick = () => {
        markActive(b);
        ratio = t.ratio || null;
        fixed = t.px || null;
        if (fixed) { $('cw').value = fixed.w; $('ch').value = fixed.h; }
        if (!work.width) return;
        sel = defaultSel();
        draw();
      };
      $('cropTemplates').appendChild(b);
    });
    RESIZE_TEMPLATES.forEach(t => {
      const b = document.createElement('button');
      b.textContent = t.name;
      b.onclick = () => {
        $('w').value = t.w; $('h').value = t.h;
        $('lock').checked = false;
      };
      $('resizeTemplates').appendChild(b);
    });

    // ---- Load image ----
    $('upload').addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        URL.revokeObjectURL(url);
        original = img;
        const ext = { 'image/png': 'png', 'image/jpeg': 'jpg', 'image/webp': 'webp' }[file.type] || 'png';
        meta = {
          name: /\.[A-Za-z0-9]+$/.test(file.name) ? file.name : file.name + '.' + ext,
          mime: { png: 'image/png', jpg: 'image/jpeg', webp: 'image/webp' }[ext]
        };
        resetToOriginal();
        ['cropBtn', 'resetBtn', 'resizeBtn'].forEach(id => $(id).disabled = false);
      };
      img.src = url;
    });

    function resetToOriginal() {
      setWork(original.naturalWidth, original.naturalHeight, c => c.drawImage(original, 0, 0));
    }

    // Replace the working image, then refresh everything
    function setWork(w, h, painter) {
      const tmp = document.createElement('canvas');
      tmp.width = w; tmp.height = h;
      const t = tmp.getContext('2d');
      if (meta.mime === 'image/jpeg') { t.fillStyle = '#fff'; t.fillRect(0, 0, w, h); }
      t.imageSmoothingQuality = 'high';
      painter(t);
      work.width = w; work.height = h;
      wctx.drawImage(tmp, 0, 0);
      $('w').value = w; $('h').value = h;
      sel = defaultSel();
      draw();
      refreshDownload();
    }

    // ---- Drawing ----
    function draw() {
      canvas.width = work.width; canvas.height = work.height;
      ctx.drawImage(work, 0, 0);
      if (sel && sel.w > 0 && sel.h > 0) {
        ctx.fillStyle = 'rgba(0,0,0,0.45)';
        ctx.fillRect(0, 0, canvas.width, sel.y);
        ctx.fillRect(0, sel.y + sel.h, canvas.width, canvas.height - sel.y - sel.h);
        ctx.fillRect(0, sel.y, sel.x, sel.h);
        ctx.fillRect(sel.x + sel.w, sel.y, canvas.width - sel.x - sel.w, sel.h);
        ctx.strokeStyle = 'red';
        ctx.lineWidth = Math.max(2, canvas.width / 400);
        ctx.strokeRect(sel.x, sel.y, sel.w, sel.h);
      }
      $('info').textContent = `Image: ${work.width} × ${work.height}` +
        (sel ? `  |  Selection: ${Math.round(sel.w)} × ${Math.round(sel.h)}` : '') + warn;
    }

    function markActive(btn) {
      document.querySelectorAll('#cropTemplates button').forEach(x => x.classList.remove('active'));
      if (btn) btn.classList.add('active');
    }
    function defaultSel() {
      warn = '';
      if (fixed) {
        if (fixed.w > work.width || fixed.h > work.height) {
          warn = `  |  Image is smaller than ${fixed.w} × ${fixed.h}, so this crop size doesn't fit.`;
          return null;
        }
        return { x: (work.width - fixed.w) / 2, y: (work.height - fixed.h) / 2, w: fixed.w, h: fixed.h };
      }
      return ratio ? centeredSelection(ratio) : null;
    }
    function placeFixed(p) {
      if (!fixed || fixed.w > work.width || fixed.h > work.height) return;
      const x = Math.min(Math.max(p.x - fixed.w / 2, 0), work.width - fixed.w);
      const y = Math.min(Math.max(p.y - fixed.h / 2, 0), work.height - fixed.h);
      sel = { x, y, w: fixed.w, h: fixed.h };
      draw();
    }
    $('cropSizeBtn').addEventListener('click', () => {
      fixed = { w: clamp($('cw').value), h: clamp($('ch').value) };
      ratio = null;
      markActive(null);
      if (!work.width) return;
      sel = defaultSel();
      draw();
    });

    function centeredSelection(r) {
      let w = work.width, h = w / r;
      if (h > work.height) { h = work.height; w = h * r; }
      return { x: (work.width - w) / 2, y: (work.height - h) / 2, w, h };
    }

    // ---- Selecting (mouse + touch via pointer events) ----
    function pos(e) {
      const r = canvas.getBoundingClientRect();
      return {
        x: Math.min(Math.max((e.clientX - r.left) * canvas.width / r.width, 0), canvas.width),
        y: Math.min(Math.max((e.clientY - r.top) * canvas.height / r.height, 0), canvas.height)
      };
    }
    canvas.addEventListener('pointerdown', e => {
      if (!work.width) return;
      canvas.setPointerCapture(e.pointerId);
      const p = pos(e);
      drag = { sx: p.x, sy: p.y };
      if (fixed) { placeFixed(p); return; }
      sel = null;
    });
    canvas.addEventListener('pointermove', e => {
      if (!drag) return;
      const p = pos(e);
      if (fixed) { placeFixed(p); return; }
      const dirX = p.x >= drag.sx ? 1 : -1, dirY = p.y >= drag.sy ? 1 : -1;
      const maxW = dirX > 0 ? canvas.width - drag.sx : drag.sx;
      const maxH = dirY > 0 ? canvas.height - drag.sy : drag.sy;
      let w = Math.min(Math.abs(p.x - drag.sx), maxW), h;
      if (ratio) {
        h = w / ratio;
        if (h > maxH) { h = maxH; w = h * ratio; }
      } else {
        h = Math.min(Math.abs(p.y - drag.sy), maxH);
      }
      sel = { x: dirX > 0 ? drag.sx : drag.sx - w, y: dirY > 0 ? drag.sy : drag.sy - h, w, h };
      draw();
    });
    const endDrag = () => { drag = null; };
    canvas.addEventListener('pointerup', endDrag);
    canvas.addEventListener('pointercancel', endDrag);

    // ---- Crop ----
    $('cropBtn').addEventListener('click', () => {
      if (!sel || sel.w < 1 || sel.h < 1) { $('info').textContent = 'Select an area first (drag on the image or pick a ratio).'; return; }
      const x = Math.round(sel.x), y = Math.round(sel.y);
      const w = Math.max(1, Math.round(sel.w)), h = Math.max(1, Math.round(sel.h));
      const snapshot = document.createElement('canvas');
      snapshot.width = work.width; snapshot.height = work.height;
      snapshot.getContext('2d').drawImage(work, 0, 0);
      setWork(w, h, c => c.drawImage(snapshot, x, y, w, h, 0, 0, w, h));
    });
    $('resetBtn').addEventListener('click', resetToOriginal);

    // ---- Resize ----
    const clamp = v => Math.min(8000, Math.max(1, Math.round(Number(v)) || 1));
    $('w').addEventListener('input', () => {
      if ($('lock').checked && work.width) $('h').value = clamp($('w').value * work.height / work.width);
    });
    $('h').addEventListener('input', () => {
      if ($('lock').checked && work.height) $('w').value = clamp($('h').value * work.width / work.height);
    });
    $('resizeBtn').addEventListener('click', () => {
      const w = clamp($('w').value), h = clamp($('h').value);
      const snapshot = document.createElement('canvas');
      snapshot.width = work.width; snapshot.height = work.height;
      snapshot.getContext('2d').drawImage(work, 0, 0);
      setWork(w, h, c => c.drawImage(snapshot, 0, 0, w, h));
    });

    // ---- Download (same format + original filename) ----
    function refreshDownload() {
      const link = $('downloadLink');
      link.classList.add('disabled');
      work.toBlob(blob => {
        if (!blob) return;
        if (blobUrl) URL.revokeObjectURL(blobUrl);
        blobUrl = URL.createObjectURL(blob);
        link.href = blobUrl;
        link.download = meta.name;
        link.classList.remove('disabled');
        $('dlInfo').textContent = `${meta.name} · ${work.width} × ${work.height} · ${(blob.size / 1024).toFixed(1)} KB`;
      }, meta.mime, 0.92);
    }
  </script>
</body>
</html>
